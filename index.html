<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#174a3b">
  <meta name="description" content="Murang'a County public service request portal. Report an issue and follow its progress.">
  <title>Murang'a Service Desk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div class="utility-bar">
    <div class="container d-flex justify-content-between align-items-center">
      <span>Murang'a County Government <span class="utility-divider">/</span> Public Service Desk</span>
      <span class="service-hours">Digital services <span class="service-dot"></span> Available 24/7</span>
    </div>
  </div>
  <nav class="navbar navbar-expand-lg portal-nav" aria-label="Main navigation">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="#home" aria-label="Murang'a Service Desk home">
        <span class="brand-mark" aria-hidden="true">M</span>
        <span class="brand-name">Murang'a <small>Service Desk</small></span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavigation" aria-controls="mainNavigation" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNavigation">
        <div class="navbar-nav ms-auto align-items-lg-center gap-lg-2" id="navigationLinks"></div>
      </div>
    </div>
  </nav>
  <main id="app" class="container page-container" tabindex="-1" aria-live="polite"></main>
  <footer class="portal-footer">
    <div class="container d-flex flex-column flex-md-row justify-content-between gap-2">
      <span>Murang'a County Public Service Desk</span>
      <span>&copy; 2026 Murang'a County Government. All rights reserved.</span>
    </div>
  </footer>
  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer" aria-live="polite" aria-atomic="true"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/requests.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
